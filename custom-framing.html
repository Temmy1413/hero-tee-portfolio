<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Framing | Hero Tee</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Hero Tee
            </a>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#about">About</a></li>

                <li><a href="index.html#services">Services</a></li>

                <li><a href="index.html#portfolio">Portfolio</a></li>

                <li><a href="index.html#contact">Contact</a></li>

            </ul>

        </nav>

    </header>


    <!-- Custom Framing Page -->

    <main class="project-page">

        <div class="project-header">

            <p class="section-intro">
                CUSTOM FRAMING
            </p>

            <h1>
                My Frames
            </h1>

            <p>
                A collection of custom framing projects created by Hero Tee.
            </p>

        </div>


        <!-- Framing Gallery -->

        <div class="framing-gallery" id="framingGallery">

        </div>


        <!-- Framing Lightbox -->

        <div class="framing-lightbox" id="framingLightbox">

            <button class="framing-lightbox-close" id="framingLightboxClose">
                &times;
            </button>

            <button class="framing-lightbox-prev" id="framingLightboxPrev">
                &#10094;
            </button>

            <img id="framingLightboxImage" src="" alt="Custom Framing">

            <button class="framing-lightbox-next" id="framingLightboxNext">
                &#10095;
            </button>

        </div>


        <!-- Back Button -->

        <div class="back-button">

            <a href="index.html#portfolio" class="btn">
                ← Back to Projects
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
