<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Graphic Design | Hero Tee</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Hero Tee
            </a>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#about">About</a></li>

                <li><a href="index.html#services">Services</a></li>

                <li><a href="index.html#portfolio">Portfolio</a></li>

                <li><a href="index.html#contact">Contact</a></li>

            </ul>

        </nav>

    </header>


    <!-- Graphic Design Page -->

    <main class="project-page">

        <div class="project-header">

            <p class="section-intro">
                GRAPHIC DESIGN
            </p>

            <h1>
                My Graphic Design
            </h1>

            <p>
                A collection of creative designs created by Hero Tee.
            </p>

        </div>


        <!-- Graphic Design Gallery -->

        <div class="design-gallery" id="designGallery">

        </div>


        <!-- Graphic Design Lightbox -->

        <div class="design-lightbox" id="designLightbox">

            <button class="design-lightbox-close" id="designLightboxClose">
                &times;
            </button>

            <button class="design-lightbox-prev" id="designLightboxPrev">
                &#10094;
            </button>

            <img id="designLightboxImage" src="" alt="Graphic Design">

            <button class="design-lightbox-next" id="designLightboxNext">
                &#10095;
            </button>

        </div>


        <!-- Back Button -->

        <div class="back-button">

            <a href="index.html#portfolio" class="btn">
                ← Back to Projects
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
